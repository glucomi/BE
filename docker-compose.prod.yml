# EC2에서만 사용. 레포 clone 없이 이 파일 하나만 서버에 올려두고
# `docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d` 로 실행한다.
# 같은 디렉터리에 .env 파일(DB_URL, DB_USER, DB_PW, ISENS_*, MYSQL_ROOT_PASSWORD)을 별도로 두고 절대 커밋하지 않는다.

services:
  app:
    image: ghcr.io/glucomi/be:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PW: ${DB_PW}
      ISENS_CLIENT_ID: ${ISENS_CLIENT_ID}
      ISENS_CLIENT_SECRET: ${ISENS_CLIENT_SECRET}
      ISENS_REDIRECT_URI: ${ISENS_REDIRECT_URI}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ddadang
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql-data:

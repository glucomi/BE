spring:
  application:
    name: DDADNG

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

isens:
  auth-base-url: https://accounts.i-sens.com
  api-base-url: https://api.i-sens.com
  client-id: ${ISENS_CLIENT_ID}
  client-secret: ${ISENS_CLIENT_SECRET}
  redirect-uri: ${ISENS_REDIRECT_URI}
  scope: offline_access

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1h
  refresh-token-validity: 14d

kakao:
  api-base-url: https://kapi.kakao.com

# 음식 DB(식약처) 적재 전까지 샘플 음식 데이터 사용
food:
  sample-data:
    enabled: true

spring:
  application:
    name: DDADNG
  config:
    import: classpath:glucose-analysis.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

isens:
  auth-base-url: https://accounts.i-sens.com
  api-base-url: https://api.i-sens.com
  client-id: ${ISENS_CLIENT_ID}
  client-secret: ${ISENS_CLIENT_SECRET}
  redirect-uri: ${ISENS_REDIRECT_URI}
  scope: offline_access

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1h
  refresh-token-validity: 14d

# 브라우저에서 API를 호출할 수 있는 프론트엔드 origin
cors:
  allowed-origins:
    - https://ddadang.vercel.app
  # 로컬 개발: 포트와 무관하게 허용
  allowed-origin-patterns:
    - http://localhost:*
    - http://127.0.0.1:*

kakao:
  api-base-url: https://kapi.kakao.com
  auth-base-url: https://kauth.kakao.com
  # 웹 카카오 로그인(인가 코드 → 토큰 교환)용. 카카오 디벨로퍼스 앱의 REST API 키 / Client Secret(사용 설정한 경우만)
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # 인가 URL 발급(GET /api/auth/kakao/authorize-url)에 허용하는 redirect URI (쉼표 구분). 카카오 디벨로퍼스에도 등록돼 있어야 한다.
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:https://ddadang.vercel.app/auth/kakao/callback,http://localhost:5000/auth/kakao/callback}

# 날짜별 혈당 점수 확정 배치 (테스트에서는 비활성)
glucose:
  score-freeze:
    scheduler-enabled: true

# 음식 DB(식약처) 적재 전까지 샘플 음식 데이터 사용
food:
  sample-data:
    enabled: true

# 사진 저장소(S3, 비공개 버킷). 자격 증명은 EC2 IAM 역할(인스턴스 프로파일) 또는 AWS_* 환경변수를 사용한다.
storage:
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-validity: 1h

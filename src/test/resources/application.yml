spring:
  config:
    import: classpath:glucose-analysis.yml
  datasource:
    url: jdbc:h2:mem:ddadang;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

isens:
  auth-base-url: http://localhost:0
  api-base-url: http://localhost:0
  client-id: test-client
  client-secret: test-secret
  redirect-uri: http://localhost:8080/api/cgm/oauth/callback
  scope: offline_access

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes-long!!
  access-token-validity: 1h
  refresh-token-validity: 14d

# 브라우저에서 API를 호출할 수 있는 프론트엔드 origin
cors:
  allowed-origins:
    - https://ddadang.vercel.app
  # 로컬 개발: 포트와 무관하게 허용
  allowed-origin-patterns:
    - http://localhost:*
    - http://127.0.0.1:*

kakao:
  api-base-url: http://localhost:0
